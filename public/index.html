<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>R&D Process Hub – Conception R1b</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    body { font-family: Inter, system-ui, sans-serif; }
    .step-done { background: #10b981; }
    .step-active { background: linear-gradient(135deg, #7c3aed, #5b21b6); }
    .sidebar-item.active { background: #ede9fe; color: #5b21b6; border-right: 3px solid #7c3aed; }
  </style>
</head>
<body class="bg-slate-50 text-slate-800">
  <!-- LOGIN -->
  <div id="login-screen" class="min-h-screen flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl shadow-lg border border-slate-200 w-full max-w-md p-8">
      <div class="flex items-center gap-3 mb-6">
        <div class="w-10 h-10 rounded-lg bg-violet-600 flex items-center justify-center">
          <i data-lucide="flask-conical" class="w-5 h-5 text-white"></i>
        </div>
        <div>
          <h1 class="text-xl font-bold">R&D Process Hub</h1>
          <p class="text-xs text-slate-500">Processus R1b – Conception</p>
        </div>
      </div>
      <form id="login-form" class="space-y-4">
        <div>
          <label class="block text-sm font-medium mb-1">Email</label>
          <input type="email" id="login-email" value="admin@rd.local" required
            class="w-full border border-slate-200 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-violet-500 outline-none" />
        </div>
        <div>
          <label class="block text-sm font-medium mb-1">Mot de passe</label>
          <input type="password" id="login-password" value="admin123" required
            class="w-full border border-slate-200 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-violet-500 outline-none" />
        </div>
        <p id="login-error" class="text-sm text-red-600 hidden"></p>
        <button type="submit" class="w-full py-2.5 bg-violet-600 hover:bg-violet-700 text-white font-medium rounded-lg text-sm">
          Se connecter
        </button>
      </form>
      <p class="text-xs text-slate-400 mt-4">Démo : admin@rd.local / admin123</p>
    </div>
  </div>

  <!-- APP -->
  <div id="app" class="hidden">
    <header class="bg-white border-b border-slate-200 sticky top-0 z-50">
      <div class="flex items-center justify-between px-6 py-3">
        <div class="flex items-center gap-3">
          <div class="w-9 h-9 rounded-lg bg-violet-600 flex items-center justify-center">
            <i data-lucide="flask-conical" class="w-5 h-5 text-white"></i>
          </div>
          <div>
            <h1 class="text-lg font-semibold">R&D Process Hub</h1>
            <p class="text-xs text-slate-500">Processus R1b – Conception</p>
          </div>
        </div>
        <div class="flex items-center gap-4">
          <button onclick="loadNotifications()" class="relative p-2 rounded-lg hover:bg-slate-100">
            <i data-lucide="bell" class="w-5 h-5 text-slate-600"></i>
            <span id="notif-dot" class="hidden absolute top-1.5 right-1.5 w-2 h-2 bg-red-500 rounded-full"></span>
          </button>
          <div class="flex items-center gap-2 pl-3 border-l border-slate-200">
            <div id="user-avatar" class="w-8 h-8 rounded-full bg-violet-100 flex items-center justify-center text-violet-700 font-medium text-sm">?</div>
            <div class="hidden sm:block">
              <p id="user-name" class="text-sm font-medium">—</p>
              <button onclick="API.logout()" class="text-xs text-slate-500 hover:text-red-600">Déconnexion</button>
            </div>
          </div>
        </div>
      </div>
    </header>

    <div class="flex">
      <aside class="w-56 bg-white border-r border-slate-200 min-h-[calc(100vh-57px)] sticky top-[57px] hidden lg:block">
        <nav class="p-3 space-y-1">
          <a href="#" data-view="dashboard" class="sidebar-item active flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium">Tableau de bord</a>
          <a href="#" data-view="processus" class="sidebar-item flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium text-slate-600 hover:bg-slate-50">Processus R1b</a>
          <a href="#" data-view="taches" class="sidebar-item flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium text-slate-600 hover:bg-slate-50">Tâches</a>
          <a href="#" data-view="stocks" class="sidebar-item flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium text-slate-600 hover:bg-slate-50">Stocks & Matériel</a>
          <a href="#" data-view="documents" class="sidebar-item flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium text-slate-600 hover:bg-slate-50">Documents</a>
          <a href="#" data-view="equipe" class="sidebar-item flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium text-slate-600 hover:bg-slate-50">Équipe</a>
          <div class="pt-4 mt-4 border-t border-slate-100 px-3">
            <p class="text-xs font-semibold text-slate-400 uppercase mb-2">Projet actif</p>
            <select id="project-select" class="w-full text-sm border border-slate-200 rounded-lg px-2 py-1.5"></select>
          </div>
        </nav>
      </aside>

      <main class="flex-1 p-6 max-w-7xl mx-auto w-full">
        <div id="view-dashboard"></div>
        <div id="view-processus" class="hidden"></div>
        <div id="view-taches" class="hidden"></div>
        <div id="view-stocks" class="hidden"></div>
        <div id="view-documents" class="hidden"></div>
        <div id="view-equipe" class="hidden"></div>
      </main>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>
